<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Market Analysis</title><style>
body{margin:0;background:#07111f;color:white;font-family:Arial}header{padding:25px;background:linear-gradient(135deg,#06111f,#0f3d2b)}h1{margin:0;color:#31e981}.wrap{padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:#0d1b2e;border:1px solid #1d3557;border-radius:18px;padding:18px}.price{font-size:28px;font-weight:900}.green{color:#31e981}.red{color:#ff6262}input,button,select{padding:15px;border-radius:12px;border:0;font-size:16px}input,select{width:70%;background:#10243a;color:white}button{background:#31e981;font-weight:900}.chart{height:260px;background:#061426;border:1px solid #1c4265;border-radius:18px;margin-top:15px;position:relative;overflow:hidden}.chart:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#17304d 1px,transparent 1px),linear-gradient(90deg,#17304d 1px,transparent 1px);background-size:100% 20%,10% 100%;opacity:.4}.candle{position:absolute;width:10px}.risk{height:14px;background:#26384f;border-radius:20px;overflow:hidden}.risk div{height:100%;background:linear-gradient(90deg,#31e981,#ffd166,#ff6262)}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #243952;padding:10px;text-align:left}.nav button{margin:5px}
</style></head><body>
<header><h1>📈 Stock Market Analysis</h1><p>Smart Indian Stock Analysis Platform</p></header>
<div class="wrap">

<script>

];
function findStock(x){x=x.toLowerCase();return stocks.find(s=>s[0].toLowerCase().includes(x))||stocks[0]}
function draw(seed){let h='<div class="chart">';for(let i=0;i<45;i++){let top=30+((i*seed)%170),ht=20+((i*7+seed)%55),up=(i+seed)%3;h+=`<div class="candle" style="left:${15+i*18}px;top:${top}px;height:${ht}px;background:${up?'#31e981':'#ff6262'}"></div>`}return h+'</div>'}
function openStock(s){let cls=s[3]<0?'red':'green';result.innerHTML=`<h2>${s[0]}</h2><span>${s[1]}</span><div class="price">₹${s[2]}</div><div class="${cls}">${s[3]>0?'▲':'▼'} ${Math.abs(s[3])}%</div><div class="nav"><button onclick="updateChart(1)">1D</button><button onclick="updateChart(7)">1W</button><button onclick="updateChart(30)">1M</button><button onclick="updateChart(365)">1Y</button></div><div id="chartBox">${draw(s[6].length+s[4].length)}</div><div class="grid"><div><b>Recommendation</b><p>${s[4]}</p></div><div><b>Risk</b><p>${s[5]}%</p></div><div><b>Expected Upside</b><p>${s[6]}</p></div><div><b>Market Cap</b><p>${s[7]}</p></div><div><b>PE Ratio</b><p>${s[8]}</p></div><div><b>ROE</b><p>${s[9]}%</p></div></div><h3>Risk Meter</h3><div class="risk"><div style="width:${s[5]}%"></div></div><h3>Fundamental Analysis</h3><p>${s[0]} shows ${s[4]} profile based on valuation, profitability, sector trend and market condition.</p><h3>GDP Impact Analysis</h3><p>If India GDP growth stays above 8%, ${s[1]} sector sentiment may improve. If GDP falls below 6%, risk may increase.</p><h3>Shareholding Pattern</h3><table><tr><th>Promoter</th><td>Stable</td><th>FII</th><td>Good</td></tr><tr><th>DII</th><td>Strong</td><th>Public</th><td>Remaining</td></tr></table><h3>Related News</h3><ul><li>${s[0]} remains in focus as investors track quarterly results.</li><li>${s[1]} sector outlook may influence stock movement.</li></ul>`}
function updateChart(n){document.getElementById('chartBox').innerHTML=draw(n)}
function search(){openStock(findStock(q.value))}
list.innerHTML=stocks.map((s,i)=>`<div class="card" onclick="openStock(stocks[${i}])"><b>${s[0]}</b><p>${s[1]}</p><div>₹${s[2]}</div><div class="${s[3]<0?'red':'green'}">${s[3]>0?'+':''}${s[3]}%</div></div>`).join('');
openStock(stocks[0]);
</script></body></html>
